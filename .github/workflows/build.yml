name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SimpleFFA.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -f work/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleFFA
          path: work/target/SimpleFFA.jar
